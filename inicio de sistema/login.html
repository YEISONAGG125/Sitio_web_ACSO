<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ACSO | Inicio de sesión</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>
        <!-- =================================
             LOGIN
        ================================== -->

        <section class="login-panel">


            <form
                id="loginForm"
                class="login-card">


            

                <div class="login-header">

                    <h1>
                        Bienvenido
                    </h1>

                    <p>
                        Inicia sesión para continuar
                    </p>

                </div>


                <!-- MENSAJE -->

                <div
                    id="mensaje"
                    class="mensaje">
                </div>



                <!-- =========================
                     USUARIO
                ========================== -->

                <div class="input-group">

                    <label for="usuario">

                        Usuario

                    </label>


                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            required
                            placeholder="Nombre de usuario"
                            autocomplete="username">

                    </div>

                </div>

                <div class="input-group">

                    <div class="password-header">

                        <label for="password">

                            Contraseña

                        </label>


                        <a
                            href="#"
                            id="forgotPassword">

                            ¿Olvidaste tu contraseña?

                        </a>

                    </div>


                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Contraseña"
                            autocomplete="current-password">


                        <button
                            type="button"
                            class="show-password"
                            id="mostrarPassword"
                            aria-label="Mostrar contraseña">

                            👁

                        </button>

                    </div>

                </div>

<br>


                <button
                    type="submit"
                    class="login-button"
                    id="btnLogin">

                    <span id="btnText">
                        Entrar
                    </span>

                    <span
                        class="arrow"
                        id="btnArrow">

                        →

                    </span>

                </button>


                <!-- =========================
                     SEPARADOR
                ========================== -->

                <div class="separator">

                    <span></span>

                    <p>
                        ¿No tienes una cuenta?
                    </p>

                    <span></span>

                </div>



                <!-- =========================
                     BOTONES
                ========================== -->

                <div class="bottom-buttons">


                    <button
                        type="button"
                        class="secondary-button"
                        onclick="window.location.href='../Yeison/index.html'">

                        ⬅ Volver

                    </button>


                    <button
                        type="button"
                        class="secondary-button register-button"
                        onclick="window.location.href='../registro/registro.html'">

                        Registrarse

                    </button>


                </div>



                <!-- =========================
                     TEXTO FINAL
                ========================== -->

                <p class="footer-text">

                    ACSO • Trabajo fácil, rápido y seguro

                </p>


            </form>

        </section>


    </div>


    <!-- =====================================
         JAVASCRIPT FIREBASE
    ====================================== -->

    <script
        type="module"
        src="script.js">
    </script>


    <!-- =====================================
         MOSTRAR CONTRASEÑA
    ====================================== -->

    <script>

        const password =
            document.getElementById("password");


        const mostrarPassword =
            document.getElementById("mostrarPassword");


        mostrarPassword.addEventListener(
            "click",
            () => {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    mostrarPassword.setAttribute(
                        "aria-label",
                        "Ocultar contraseña"
                    );

                } else {

                    password.type = "password";

                    mostrarPassword.textContent =
                        "👁";

                    mostrarPassword.setAttribute(
                        "aria-label",
                        "Mostrar contraseña"
                    );

                }

            }
        );

    </script>


</body>

</html>
