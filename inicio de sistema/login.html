<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ACSO | Inicio de sesión</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>
        <!-- =================================
             LOGIN
        ================================== -->

        <section class="login-panel">


            <form
                id="loginForm"
                class="login-card">


            

                <div class="login-header">

                    <h1>
                        Bienvenido
                    </h1>

                    <p>
                        Inicia sesión para continuar
                    </p>

                </div>


                <!-- MENSAJE -->

                <div
                    id="mensaje"
                    class="mensaje">
                </div>



                <!-- =========================
                     USUARIO
                ========================== -->

                <div class="input-group">

                    <label for="usuario">Correo electrónico</label>


                    <div class="input-wrapper">

                        


                        <input
                           
                            id="usuario" type="email" placeholder="correo@ejemplo.com" autocomplete="email"
                            name="usuario"
                            required
                           
                           >

                    </div>

                </div>

                <div class="input-group">

                    <div class="password-header">

                        <label for="password">

                            Contraseña

                        </label>


                        <a
                            href="../recuperar/recuperar.html"
                            id="forgotPassword">

                            ¿Olvidaste tu contraseña?

                        </a>

                    </div>


                    <div class="input-wrapper">

                        


                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Contraseña"
                            autocomplete="current-password">


                        <button
                            type="button"
                            class="show-password"
                            id="mostrarPassword"
                            aria-label="Mostrar contraseña">

                            Mostrar

                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="recordarme">

                        <span class="custom-checkbox"></span>

                        <span>
                            Recordarme
                        </span>

                    </label>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="btnLogin">

                    <span id="btnText">
                        Entrar
                    </span>

                    <span
                        class="arrow"
                        id="btnArrow">



                    </span>

                </button>


                <!-- =========================
                     SEPARADOR
                ========================== -->

                <div class="separator">

                    <span></span>

                    <p>
                        ¿No tienes una cuenta?
                    </p>

                    <span></span>

                </div>



                <!-- =========================
                     BOTONES
                ========================== -->

                <div class="bottom-buttons">


                    <button
                        type="button"
                        class="secondary-button"
                        onclick="window.location.href='../Yeison/index.html'">

                        Volver

                    </button>


                    <button
                        type="button"
                        class="secondary-button register-button"
                        onclick="window.location.href='../registro/registro.html'">

                        Registrarse

                    </button>


                </div>



                <!-- =========================
                     TEXTO FINAL
                ========================== -->

                <p class="footer-text">

                    ACSO • Trabajo fácil, rápido y seguro

                </p>


            </form>


            <!-- =================================
                 SEGUNDO PASO: SUPERVISOR
            ================================== -->

            <form
                id="supervisorForm"
                class="login-card"
                hidden>

                <div class="login-header">

                    <h1 id="supTitulo">
                        Verificación de supervisor
                    </h1>

                    <p id="supSubtitulo">
                        Ingresa tu clave de supervisor para continuar
                    </p>

                </div>

                <div
                    id="mensajeSup"
                    class="mensaje">
                </div>

                <!-- Solo en la primera activación -->
                <div class="input-group" id="grupoCodigo" hidden>
                    <label for="codigoAut">Código de autorización</label>
                    <div class="input-wrapper">
                        
                        <input
                            type="password"
                            id="codigoAut"
                            placeholder="Te lo entrega el administrador"
                            autocomplete="off">
                    </div>
                </div>

                <div class="input-group">
                    <label for="claveSup" id="labelClaveSup">Clave de supervisor</label>
                    <div class="input-wrapper">
                        
                        <input
                            type="password"
                            id="claveSup"
                            placeholder="Clave de supervisor"
                            autocomplete="off">
                    </div>
                </div>

                <div class="input-group" id="grupoClaveConfirmar" hidden>
                    <label for="claveSupConfirmar">Confirmar clave</label>
                    <div class="input-wrapper">
                        
                        <input
                            type="password"
                            id="claveSupConfirmar"
                            placeholder="Repite la clave"
                            autocomplete="off">
                    </div>
                </div>

                <p class="ayuda-clave" id="ayudaClave" hidden>
                    Mínimo 10 caracteres, con letras y números, y distinta a tu contraseña.
                </p>

                <button
                    type="submit"
                    class="login-button"
                    id="btnSup">

                    <span id="btnSupText">Verificar</span>
                    <span class="arrow" id="btnSupArrow"></span>

                </button>

                <div class="bottom-buttons">
                    <button
                        type="button"
                        class="secondary-button"
                        id="btnCancelarSup">

                        Cancelar

                    </button>
                </div>

            </form>

        </section>


    </div>


    <!-- =====================================
         JAVASCRIPT FIREBASE
    ====================================== -->

    <script
        type="module"
        src="script.js">
    </script>


    <!-- =====================================
         MOSTRAR CONTRASEÑA
    ====================================== -->

    <script>

        const password =
            document.getElementById("password");


        const mostrarPassword =
            document.getElementById("mostrarPassword");


        mostrarPassword.addEventListener(
            "click",
            () => {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    mostrarPassword.setAttribute(
                        "aria-label",
                        "Ocultar contraseña"
                    );

                } else {

                    password.type = "password";

                    mostrarPassword.textContent =
                        "Mostrar";

                    mostrarPassword.setAttribute(
                        "aria-label",
                        "Mostrar contraseña"
                    );

                }

            }
        );

    </script>


<script src="../FIREBASE/iconos.js" defer></script>
</body>

</html>
