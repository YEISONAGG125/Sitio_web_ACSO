<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ACSO | Registro</title>

    <link
        rel="stylesheet"
        href="../inicio%20de%20sistema/style.css">
    <link rel="stylesheet" href="extra.css">

    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="../FIREBASE/accesibilidad.css">
    <script src="../FIREBASE/accesibilidad.js" defer></script>
</head>


<body>

    <section class="login-panel">


            <form
                id="formRegistro"
                class="login-card">
                <!-- TITULO -->

                <div class="login-header">

                    <h1>
                        Crear cuenta
                    </h1>

                    <p>
                        Completa los datos para registrarte
                    </p>

                </div>


                <!-- MENSAJE -->

                <div
                    id="mensaje"
                    class="mensaje">
                </div>


                <!-- =================================
                     NOMBRE
                ================================== -->

                <div class="input-group">

                    <label for="nombre">
                        Nombre y apellido
                    </label>

                    <div class="input-wrapper">

                        

                        <input
                            type="text"
                            id="nombre"
                            required
                            placeholder="Ingresa tu nombre completo"
                            autocomplete="name">

                    </div>

                </div>


                <!-- =================================
                     CARGO
                ================================== -->

                <div class="input-group">

                    <label for="cargo">
                        Cargo
                    </label>

                    <div class="input-wrapper">

                        

                        <select
                            id="cargo"
                            required>

                            <option value="">
                                Seleccione su cargo
                            </option>

                            <option value="empleado">
                                Empleado
                            </option>

                            <option value="supervisor">
                                Supervisor
                            </option>

                            <option value="cliente">
                                Cliente
                            </option>

                        </select>

                    </div>

                </div>


                <!-- =================================
                     SOLO SUPERVISOR
                ================================== -->

                <div id="bloqueSupervisor" class="bloque-supervisor" hidden>

                    <p class="aviso-supervisor">
                        Las cuentas de supervisor requieren autorización.
                        Pide el código al administrador del sistema.
                    </p>

                    <div class="input-group">
                        <label for="codigoAut">Código de autorización</label>
                        <div class="input-wrapper">
                            
                            <input
                                type="password"
                                id="codigoAut"
                                placeholder="Código del administrador"
                                autocomplete="off">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="claveSup">Clave de supervisor</label>
                        <div class="input-wrapper">
                            
                            <input
                                type="password"
                                id="claveSup"
                                placeholder="Mín. 10 caracteres, letras y números"
                                autocomplete="new-password">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="claveSupConfirmar">Confirmar clave de supervisor</label>
                        <div class="input-wrapper">
                            
                            <input
                                type="password"
                                id="claveSupConfirmar"
                                placeholder="Repite la clave"
                                autocomplete="new-password">
                        </div>
                    </div>

                </div>

                <!-- =================================
                     CORREO
                ================================== -->

                <div class="input-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <div class="input-wrapper">

                        

                        <input
                            type="email"
                            id="correo"
                            required
                            placeholder="correo@ejemplo.com"
                            autocomplete="email">

                    </div>

                </div>


                <!-- =================================
                     USUARIO
                ================================== -->

                


                <!-- =================================
                     CONTRASEÑA
                ================================== -->

                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-wrapper">

                        

                        <input
                            type="password"
                            id="password"
                            required
                            placeholder="Crea una contraseña"
                            autocomplete="new-password">

                        <button
                            type="button"
                            class="show-password"
                            id="mostrarPassword">

                            Mostrar

                        </button>

                    </div>

                </div>


                <!-- =================================
                     BOTÓN REGISTRARSE
                ================================== -->

                <button
                    type="submit"
                    class="login-button"
                    id="btnRegistro">

                    <span id="btnText">
                        Crear cuenta
                    </span>

                    <span
                        class="arrow"
                        id="btnArrow">



                    </span>

                </button>


                <!-- =================================
                     SEPARADOR
                ================================== -->

                <div class="separator">

                    <span></span>

                    <p>
                        ¿Ya tienes una cuenta?
                    </p>

                    <span></span>

                </div>


                <!-- =================================
                     VOLVER AL LOGIN
                ================================== -->

                <div class="bottom-buttons">
                    <a
                    href="../inicio de sistema/login.html"
                    class="secondary-button">

                    Iniciar sesión

                </a>
                    <a
                    href="../Yeison/index.html"
                    class="secondary-button">

                    Volver al inicio

                </a>
                </div>


                <!-- FOOTER -->

                <p class="footer-text">

                    ACSO • Trabajo fácil, rápido y seguro

                </p>


            </form>

        </section>


    </div>

<script src="../FIREBASE/iconos.js" defer></script>
</body>
<script type="module" src="javascript.js"></script>
</html>
