<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ACSO | Crear cuenta</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo decorativo -->
    <div class="background">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <!-- Contenedor principal -->
    <main class="register-container">

        <!-- Panel de registro -->
        <section class="register-panel">

            <form id="formRegistro" class="register-card">

                <!-- Encabezado -->
                <header class="register-header">
                    <h1>Crear cuenta</h1>
                    <p>Completa los datos para registrarte</p>
                </header>

                <!-- Mensajes de respuesta -->
                <div id="mensaje" class="mensaje" role="status"
                     aria-live="polite"></div>

                <!-- Nombre completo -->
                <div class="input-group">
                    <label for="nombre">Nombre y apellido</label>

                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingresa tu nombre completo"
                            autocomplete="name"
                            required
                        >
                    </div>
                </div>

                <!-- Cargo -->
                <div class="input-group">
                    <label for="cargo">Cargo</label>

                    <div class="input-wrapper">
                        <select id="cargo" name="cargo" required>
                            <option value="" disabled selected>
                                Seleccione su cargo
                            </option>

                            <option value="empleado">Empleado</option>
                            <option value="supervisor">Supervisor</option>
                            <option value="cliente">Cliente</option>
                        </select>
                    </div>
                </div>

                <!-- Correo electrónico -->
                <div class="input-group">
                    <label for="correo">Correo electrónico</label>

                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- Nombre de usuario -->
                <div class="input-group">
                    <label for="usuario">Usuario</label>

                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Crea tu nombre de usuario"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="input-group">
                    <label for="password">Contraseña</label>

                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una contraseña"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="mostrarPassword"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <!-- Botón de registro -->
                <button
                    type="submit"
                    class="register-button"
                    id="btnRegistro"
                >
                    <span id="btnText">Crear cuenta</span>
                    <span class="arrow" id="btnArrow">→</span>
                </button>

                <!-- Enlace para iniciar sesión -->
                <div class="separator">
                    ¿Ya tienes una cuenta?
                </div>

                <a
                    href="../inicio de sistema/login.html"
                    class="login-link"
                >
                    ← Iniciar sesión
                </a>

                <!-- Volver al inicio -->
                <a
                    href="../yeison/index.html"
                    class="back-home"
                >
                    Volver al inicio
                </a>

                <!-- Pie de página -->
                <footer class="footer-text">
                    ACSO • Trabajo fácil, rápido y seguro
                </footer>

            </form>

        </section>

    </main>

    <!-- JavaScript del registro -->
    <script src="javascript.js"></script>

</body>
</html>
